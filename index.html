<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>随手看</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#353a3a;background:#f3f3ef}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:2px;color:#858b87}h1{font-size:27px;font-weight:550;margin:9px 0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9ddd6;background:transparent;color:#535e56;border-radius:12px;padding:10px 14px}button:active{background:#e2e6dd}button.primary{background:#536252;border-color:#536252;color:#fff}.summary{border-top:1px solid #d8dcd4;border-bottom:1px solid #d8dcd4;padding:15px 0;color:#7c847c;font-size:13px;display:flex;justify-content:space-between}.card{padding:23px 0;border-bottom:1px solid #dfe2da;display:flex;align-items:center;gap:12px}.initial{flex:none;width:39px;height:39px;background:#e6e9e1;border-radius:13px;display:grid;place-items:center;color:#788170;font-size:13px}.detail{flex:1;min-width:0}.name{font-size:16px;overflow-wrap:anywhere}.code{font-size:12px;color:#92978e;margin-top:6px;letter-spacing:.6px}.remove{padding:7px 10px;border:0;font-size:18px;color:#92978e}.empty{text-align:center;padding:60px 15px;color:#91988d;line-height:1.9;font-size:14px}.foot{font-size:12px;color:#92988d;line-height:1.8;margin-top:25px}.tools{display:flex;gap:10px;margin-top:20px}.tools button{font-size:12px;padding:8px 12px}.notice{font-size:12px;line-height:1.7;padding:12px;border-radius:10px;background:#e6e8df;margin-top:15px}dialog{border:1px solid #dbdfd5;border-radius:22px;background:#f7f7f2;color:#353a3a;padding:26px;width:calc(100% - 36px);max-width:420px}dialog::backdrop{background:#29312766}h2{font-size:21px;font-weight:550;margin:0 0 24px}label{display:block;font-size:13px;margin:18px 0 8px;color:#737d6c}input,select{width:100%;padding:13px;background:#fff;border:1px solid #d8ddd1;border-radius:10px;color:#353a3a;font-size:16px}input:focus,select:focus{outline:2px solid #9ea990;outline-offset:2px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.error{font-size:13px;color:#776344;min-height:18px;margin-top:12px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#495246;color:white;padding:12px 18px;border-radius:12px;font-size:13px;width:max-content;max-width:90%;box-shadow:0 5px 25px #0001}button:focus-visible{outline:2px solid #79886e;outline-offset:3px}
.quote{text-align:right;flex:none}.price{font-size:20px;font-variant-numeric:tabular-nums}.change{font-size:12px;margin-top:5px;color:#717a6b}.quote-time{font-size:10px;color:#969c91;margin-top:5px}.results{max-height:230px;overflow:auto;margin-top:10px}.result{display:block;width:100%;text-align:left;margin:5px 0;font-size:14px}.search-note{font-size:12px;color:#89917f;margin-top:8px}dialog{max-height:90dvh;overflow:auto}.stock-link{padding:0;border:0;border-radius:0;text-align:left;color:inherit;font-size:16px;text-decoration:underline;text-decoration-color:#c7cdbf;text-underline-offset:5px}.edit{border:0;padding:6px;font-size:12px;color:#87917f}.chart-meta{font-size:13px;color:#75806d;line-height:1.9}.chart-svg{width:100%;height:auto;display:block;touch-action:pan-y}.chart-note{font-size:12px;color:#92988d;line-height:1.7}#chartDialog{max-width:540px}</style>
</head>
<body><main>

<div class="summary"><span>我的关注 · <button id="refresh" style="padding:4px 8px;font-size:12px">刷新</button></span><span style="display:flex;align-items:center;gap:12px"><span id="count">0 项</span><button id="add" style="padding:5px 10px;font-size:12px">＋ 添加</button></span></div>
<section id="list" aria-label="自选股票"></section>
<div class="foot" hidden><span id="quoteStatus" role="status">正在准备行情…</span><br>腾讯财经行情 · 前台每 15 秒刷新 · 港股使用较新报价接口，美股可能延迟；以每项行情时间为准。<br>自选保存在当前打开环境中；请保留原文件，并用相同浏览器打开。清理浏览器数据可能清除清单。</div>
<div class="tools"><button id="export">导出备份</button><button id="import">导入备份</button></div>
<div class="notice" id="storageNote" hidden>当前打开方式不支持本地保存。关闭后清单会丢失，请使用“导出备份”保存，或换用支持本地存储的浏览器打开。</div>
<input type="file" id="file" accept="application/json,.json" hidden>
</main>
<dialog id="dialog"><form id="form"><h2>添加关注</h2><label for="search">搜索股票</label><input id="search" placeholder="代码、首字母或名称，如 600 / gzmt / 茅台" autocomplete="off"><div class="search-note" id="searchNote" role="status">联网搜索，点击结果填入下方，也可手动填写。</div><div class="results" id="results"></div><label for="market">市场</label><select id="market"><option value="SH">沪市 A 股</option><option value="SZ">深市 A 股</option><option value="BJ">北交所</option><option value="HK">港股</option><option value="US">美股</option></select><label for="symbol">股票代码</label><input id="symbol" placeholder="例如 600519" maxlength="20" autocomplete="off" autocapitalize="characters" required><label for="name">名称或自定义别名</label><input id="name" placeholder="例如 贵州茅台 / 关注一" maxlength="40" autocomplete="off" required><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm"><h2>编辑别名</h2><label for="alias">名称或别名</label><input id="alias" required maxlength="40" autocomplete="off"><div class="actions"><button type="button" id="editCancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="chartDialog"><h2 id="chartTitle">当日分时</h2><div class="chart-meta" id="chartMeta" role="status"></div><div id="chartPlot"></div><div class="chart-meta" id="pointInfo"></div><p class="chart-note" hidden>上图：分时价格；下图：每分钟成交量。点击或拖动查看数据。首根量柱含开盘前累计成交，缺失分钟的成交量合并至下一个数据点。数据截至所示时间，可能存在延迟。</p><div class="actions"><button id="chartRefresh">刷新</button><button id="chartClose">关闭</button></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='quiet-watchlist-v1',markets={SH:'沪市',SZ:'深市',BJ:'北交所',HK:'港股',US:'美股'};let items=[],persistent=true,timer;

let quotes={},busy=false;
try{quotes=JSON.parse(localStorage.getItem(key+'-quotes')||'{}')||{}}catch(e){}
function formatTime(t){return /^\d{14}$/.test(t)?t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8)+' '+t.slice(8,10)+':'+t.slice(10,12)+':'+t.slice(12,14):t}
async function refreshQuotes(){
 if(busy)return;if(!items.length){$('quoteStatus').textContent='添加关注后自动加载行情';return}
 busy=true;$('refresh').disabled=true;$('quoteStatus').textContent='正在更新行情…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);let found=0;
 try{const codes=items.map(x=>(x.market==='HK'?'r_hk':x.market.toLowerCase())+x.symbol);for(let offset=0;offset<codes.length;offset+=60){const response=await fetch('https://qt.gtimg.cn/q='+codes.slice(offset,offset+60).map(encodeURIComponent).join(',')+'&_='+Date.now(),{signal:controller.signal,referrerPolicy:'no-referrer'});if(!response.ok)throw Error();const text=new TextDecoder('gbk').decode(await response.arrayBuffer());for(const match of text.matchAll(/v_([A-Za-z0-9_.\-]+)="([^"]*)"/g)){const f=match[2].split('~'),price=Number(f[3]),pct=Number(f[32]);if(f.length>32&&f[3]&&f[32]&&Number.isFinite(price)&&price>0&&Number.isFinite(pct)){quotes[match[1].replace(/^r_hk/,'hk')]={price,pct,time:formatTime(f[30])};found++}}}
 try{localStorage.setItem(key+'-quotes',JSON.stringify(quotes))}catch(e){}$('quoteStatus').textContent='已获取 '+found+' / '+items.length+' 项 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})+' 读取'+(found<items.length?'，缺失项保留旧值或显示暂无行情':'');
 }catch(e){$('quoteStatus').textContent='更新失败，当前显示上次保存的行情；请检查网络后重试'}finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;render()}
}
$('refresh').onclick=refreshQuotes;setInterval(()=>{if(!document.hidden)refreshQuotes()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshQuotes()});window.addEventListener('online',refreshQuotes);
let searchTimer,searchVersion=0;
$('search').oninput=()=>{clearTimeout(searchTimer);const version=++searchVersion,query=$('search').value.trim();$('results').replaceChildren();if(!query){$('searchNote').textContent='输入代码、首字母或股票名称';return}$('searchNote').textContent='正在搜索…';searchTimer=setTimeout(()=>searchStocks(query,version),350)};
function searchStocks(query,version){const script=document.createElement('script');script.charset='utf-8';script.referrerPolicy='no-referrer';script.src='https://smartbox.gtimg.cn/s3/?q='+encodeURIComponent(query)+'&t=all';let done=false;const timeout=setTimeout(()=>finish(false),10000);function finish(ok){if(done)return;done=true;clearTimeout(timeout);script.remove();if(version!==searchVersion)return;const raw=ok&&typeof window.v_hint==='string'?window.v_hint:'';const results=raw.split('^').map(row=>{const f=row.split('~');return{market:(f[0]||'').toUpperCase(),symbol:f[1]||'',name:f[2]||''}}).filter(valid);$('results').replaceChildren();$('searchNote').textContent=results.length?'选择一项，再点击保存添加':ok?'没有找到匹配股票，可换个关键词或手动填写':'搜索失败，请检查网络，或手动填写';for(const item of results.slice(0,20)){const button=document.createElement('button');button.type='button';button.className='result';button.textContent=item.name+' · '+item.symbol+' · '+markets[item.market];button.onclick=()=>{$('market').value=item.market;$('symbol').value=item.symbol;$('name').value=item.name;$('searchNote').textContent='已选中 '+item.name+'，可修改别名后保存';$('results').replaceChildren()};$('results').append(button)}}script.onload=()=>finish(true);script.onerror=()=>finish(false);document.head.append(script)}


let editing=null,chartItem=null,chartVersion=0;
$('editCancel').onclick=()=>$('editDialog').close();$('editForm').onsubmit=e=>{e.preventDefault();const name=$('alias').value.trim();if(!name){$('alias').setCustomValidity('请输入别名');$('alias').reportValidity();return}if(editing&&items.includes(editing)){editing.name=name;save()}$('editDialog').close();toast('别名已保存')};$('alias').oninput=()=>$('alias').setCustomValidity('');
$('chartClose').onclick=()=>$('chartDialog').close();$('chartRefresh').onclick=()=>loadChart();$('chartDialog').addEventListener('close',()=>{chartVersion++;chartItem=null});
function openChart(item){chartItem=item;$('chartTitle').textContent=item.name+' · 分时';$('chartDialog').showModal();loadChart()}
function svgNode(tag,attrs,text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el}
async function loadChart(){if(!chartItem)return;const item=chartItem,version=++chartVersion;const code=item.market.toLowerCase()+item.symbol;$('chartMeta').textContent='正在加载分时…';$('chartPlot').replaceChildren();$('pointInfo').textContent='';$('chartRefresh').disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
try{const res=await fetch('https://web.ifzq.gtimg.cn/appstock/app/minute/query?code='+encodeURIComponent(code)+'&_='+Date.now(),{signal:controller.signal,referrerPolicy:'no-referrer'});if(!res.ok)throw Error();const body=await res.json();if(version!==chartVersion)return;const data=body.data?.[code]?.data;const points=(data?.data||[]).map(row=>{const f=row.trim().split(/\s+/);return{time:f[0],price:Number(f[1]),total:Number(f[2])}}).filter(x=>/^\d{4}$/.test(x.time)&&Number.isFinite(x.price)&&x.price>0&&Number.isFinite(x.total)&&x.total>=0);if(!points.length)throw Error();const unit=['SH','SZ','BJ'].includes(item.market)?'手':'股';points.forEach((x,i)=>x.volume=Math.max(0,x.total-(i?points[i-1].total:0)));const last=points.at(-1),date=data.date||'';const time=t=>t.slice(0,2)+':'+t.slice(2);const fmt=n=>n.toLocaleString('zh-CN',{maximumFractionDigits:0});$('chartMeta').textContent=(date.length===8?date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6):date)+' · 截至 '+time(last.time)+' · 当日累计成交量 '+fmt(last.total)+' '+unit;
const w=440,h=290,left=55,right=425,top=16,bottom=176,volTop=211,volBottom=263;const min=Math.min(...points.map(x=>x.price)),max=Math.max(...points.map(x=>x.price)),pad=Math.max((max-min)*.08,max*.0005),lo=min-pad,hi=max+pad;const x=i=>left+i*(right-left)/Math.max(1,points.length-1),y=p=>bottom-(p-lo)/(hi-lo)*(bottom-top),vmax=Math.max(1,...points.map(p=>p.volume));const svg=svgNode('svg',{viewBox:`0 0 ${w} ${h}`,class:'chart-svg',role:'img','aria-label':'当日分时价格及每分钟成交量'});for(let i=0;i<3;i++){const level=lo+(hi-lo)*i/2,py=y(level);svg.append(svgNode('line',{x1:left,y1:py,x2:right,y2:py,stroke:'#dce0d5'}),svgNode('text',{x:left-6,y:py+4,'text-anchor':'end','font-size':10,fill:'#89917e'},level.toFixed(item.market==='HK'?3:2)))}svg.append(svgNode('text',{x:left,y:203,'font-size':10,fill:'#89917e'},'每分钟成交量（'+unit+'）'));svg.append(svgNode('polyline',{points:points.map((p,i)=>x(i)+','+y(p.price)).join(' '),fill:'none',stroke:'#65755c','stroke-width':1.6}));points.forEach((p,i)=>{const barHeight=p.volume/vmax*(volBottom-volTop);svg.append(svgNode('rect',{x:x(i)-.5,y:volBottom-barHeight,width:Math.max(.8,(right-left)/points.length*.65),height:barHeight,fill:'#a2ad96'}))});for(const i of [0,Math.floor((points.length-1)/2),points.length-1])svg.append(svgNode('text',{x:x(i),y:284,'text-anchor':'middle','font-size':10,fill:'#89917e'},time(points[i].time)));
const cursor=svgNode('line',{x1:right,x2:right,y1:top,y2:volBottom,stroke:'#879379','stroke-dasharray':'3 3'});svg.append(cursor);function select(i){const p=points[i];cursor.setAttribute('x1',x(i));cursor.setAttribute('x2',x(i));$('pointInfo').textContent=time(p.time)+' · 价格 '+p.price.toFixed(item.market==='HK'?3:2)+' · 分钟成交量 '+fmt(p.volume)+' '+unit}svg.onpointerdown=svg.onpointermove=e=>{if(e.type==='pointermove'&&!e.buttons&&e.pointerType!=='mouse')return;const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width*w;select(Math.min(points.length-1,Math.max(0,Math.round((px-left)/(right-left)*(points.length-1)))))};$('chartPlot').append(svg);select(points.length-1);
}catch(e){if(version===chartVersion)$('chartMeta').textContent='分时暂不可用，请稍后刷新；当前市场或代码也可能不受数据源支持。'}finally{clearTimeout(timeout);if(version===chartVersion)$('chartRefresh').disabled=false}}

function valid(x){return x&&Object.hasOwn(markets,x.market)&&typeof x.symbol==='string'&&typeof x.name==='string'&&x.name.trim().length>0&&x.name.length<=40&&(x.market==='US'?/^[A-Z][A-Z0-9.\-]{0,19}$/.test(x.symbol):new RegExp(x.market==='HK'?'^\\d{5}$':'^\\d{6}$').test(x.symbol))}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
try{const probe=key+'-test';localStorage.setItem(probe,'1');localStorage.removeItem(probe);const raw=localStorage.getItem(key);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(valid))throw Error('data');items=data}}catch(e){persistent=false;$('storageNote').hidden=false}
function save(){setTimeout(refreshQuotes,0);try{localStorage.setItem(key,JSON.stringify(items))}catch(e){persistent=false;$('storageNote').hidden=false}render()}
function render(){$('list').replaceChildren();$('count').textContent=items.length+' 项';if(!items.length){const el=document.createElement('div');el.className='empty';el.textContent='留一份自己的关注清单。\n点击右上角，添加第一只股票。';el.style.whiteSpace='pre-line';$('list').append(el);return}items.forEach((item,index)=>{const row=document.createElement('article');row.className='card';const icon=document.createElement('div');icon.className='initial';icon.textContent=String(index+1).padStart(2,'0');const detail=document.createElement('div');detail.className='detail';const name=document.createElement('button');name.type='button';name.className='name stock-link';name.textContent=item.name;name.setAttribute('aria-label',item.name+'，查看分时');name.onclick=()=>openChart(item);const code=document.createElement('div');code.className='code';code.textContent=markets[item.market]+' · '+item.symbol;detail.append(name);const edit=document.createElement('button');edit.type='button';edit.className='edit';edit.textContent='编辑';edit.onclick=()=>{editing=item;$('alias').value=item.name;$('editDialog').showModal()};detail.append(edit);const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','删除 '+item.name);del.onclick=()=>{if(confirm('从关注清单删除“'+item.name+'”？')){items.splice(index,1);save()}};const q=quotes[item.market.toLowerCase()+item.symbol],box=document.createElement('div');box.className='quote';const price=document.createElement('div');price.className='price';price.textContent=q?q.price.toFixed(item.market==='HK'?3:2):'—';const change=document.createElement('div');change.className='change';change.textContent=q?(q.pct>0?'+':'')+q.pct.toFixed(2)+'%':'暂无行情';const time=document.createElement('div');time.className='quote-time';time.textContent=q?q.time:'等待更新';box.append(price,change,time);row.append(icon,detail,box,del);$('list').append(row)})}
$('add').onclick=()=>{$('error').textContent='';$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('market').onchange=()=>{$('symbol').placeholder=$('market').value==='US'?'例如 AAPL':$('market').value==='HK'?'例如 00700':'例如 600519'};
$('form').onsubmit=e=>{e.preventDefault();const item={market:$('market').value,symbol:$('symbol').value.trim().toUpperCase(),name:$('name').value.trim()};if(!valid(item)){$('error').textContent='请输入正确代码：A 股 6 位、港股 5 位，美股使用英文代码。';return}if(items.some(x=>x.market===item.market&&x.symbol===item.symbol)){$('error').textContent='这只股票已经在清单里了。';return}items.push(item);save();$('dialog').close();$('symbol').value='';$('name').value='';toast(persistent?'已保存到本机':'已添加，请导出备份保存')};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,stocks:items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='随手看-自选备份.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>1000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.stocks)||!data.stocks.every(valid))throw Error();let added=0;for(const x of data.stocks)if(!items.some(y=>y.market===x.market&&y.symbol===x.symbol)){items.push({market:x.market,symbol:x.symbol,name:x.name});added++}save();toast('已导入 '+added+' 项关注')}catch(e){toast('无法读取备份，请选择本页面导出的 JSON 文件')}finally{$('file').value=''}};render();refreshQuotes();
})();
</script></body></html>
