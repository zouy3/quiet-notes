<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>随手看</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#353a3a;background:#f3f3ef}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:2px;color:#858b87}h1{font-size:27px;font-weight:550;margin:9px 0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9ddd6;background:transparent;color:#535e56;border-radius:12px;padding:10px 14px}button:active{background:#e2e6dd}button.primary{background:#536252;border-color:#536252;color:#fff}.summary{border-top:1px solid #d8dcd4;border-bottom:1px solid #d8dcd4;padding:15px 0;color:#7c847c;font-size:13px;display:flex;justify-content:space-between}.card{padding:23px 0;border-bottom:1px solid #dfe2da;display:flex;align-items:center;gap:12px}.initial{flex:none;width:39px;height:39px;background:#e6e9e1;border-radius:13px;display:grid;place-items:center;color:#788170;font-size:13px}.detail{flex:1;min-width:0}.name{font-size:16px;overflow-wrap:anywhere}.code{font-size:12px;color:#92978e;margin-top:6px;letter-spacing:.6px}.remove{padding:7px 10px;border:0;font-size:18px;color:#92978e}.empty{text-align:center;padding:60px 15px;color:#91988d;line-height:1.9;font-size:14px}.foot{font-size:12px;color:#92988d;line-height:1.8;margin-top:25px}.tools{display:flex;gap:10px;margin-top:20px}.tools button{font-size:12px;padding:8px 12px}.notice{font-size:12px;line-height:1.7;padding:12px;border-radius:10px;background:#e6e8df;margin-top:15px}dialog{border:1px solid #dbdfd5;border-radius:22px;background:#f7f7f2;color:#353a3a;padding:26px;width:calc(100% - 36px);max-width:420px}dialog::backdrop{background:#29312766}h2{font-size:21px;font-weight:550;margin:0 0 24px}label{display:block;font-size:13px;margin:18px 0 8px;color:#737d6c}input,select{width:100%;padding:13px;background:#fff;border:1px solid #d8ddd1;border-radius:10px;color:#353a3a;font-size:16px}input:focus,select:focus{outline:2px solid #9ea990;outline-offset:2px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.error{font-size:13px;color:#776344;min-height:18px;margin-top:12px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#495246;color:white;padding:12px 18px;border-radius:12px;font-size:13px;width:max-content;max-width:90%;box-shadow:0 5px 25px #0001}button:focus-visible{outline:2px solid #79886e;outline-offset:3px}
.quote{text-align:right;flex:none}.price{font-size:20px;font-variant-numeric:tabular-nums}.change{font-size:12px;margin-top:5px;color:#717a6b}.quote-time{font-size:10px;color:#969c91;margin-top:5px}.results{max-height:230px;overflow:auto;margin-top:10px}.result{display:block;width:100%;text-align:left;margin:5px 0;font-size:14px}.search-note{font-size:12px;color:#89917f;margin-top:8px}dialog{max-height:90dvh;overflow:auto}.stock-link{padding:0;border:0;border-radius:0;text-align:left;color:inherit;font-size:16px;text-decoration:underline;text-decoration-color:#c7cdbf;text-underline-offset:5px}.edit{border:0;padding:6px;font-size:12px;color:#87917f}.chart-meta{font-size:13px;color:#75806d;line-height:1.9}.chart-svg{width:100%;height:auto;display:block;touch-action:pan-y}.chart-note{font-size:12px;color:#92988d;line-height:1.7}#chartDialog{max-width:540px}.account-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:12px;color:#88917e}.account-bar button{padding:6px 9px;font-size:12px}.account-actions{display:flex;flex-wrap:wrap;gap:6px}.sync-status{font-size:11px;color:#89927e;min-height:18px;margin-top:8px;line-height:1.6}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
/* Compact mobile watchlist */
main{max-width:620px;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.summary{position:sticky;top:0;z-index:2;background:#f3f3ef;min-height:46px;padding:7px 0;align-items:center;gap:8px;font-size:12px}
.summary>span:last-child{gap:7px!important}.summary button{min-height:30px;border-radius:9px}
.card{padding:7px 0;min-height:54px;display:grid;grid-template-columns:20px minmax(0,1fr) 142px;gap:8px}
.initial{width:auto;height:auto;background:none;border-radius:0;font-size:10px;color:#9aa18f}
.stock-link{display:block;width:100%;font-size:14px;line-height:1.4;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px}
.quote{display:grid;grid-template-columns:1fr 57px;column-gap:7px;align-items:baseline;min-width:0}
.price{font-size:16px;letter-spacing:-.3px;line-height:1.3}.change{font-size:11px;margin:0;font-variant-numeric:tabular-nums}.quote-time{font-size:9px;margin:1px 0 0;grid-column:1/-1;line-height:1.2}
.row-controls{display:none}.managing .card{grid-template-columns:20px minmax(0,1fr) 142px;padding:8px 0}.managing .row-controls{display:flex;grid-column:2/-1;gap:6px;justify-content:flex-end}
.row-controls button{height:30px;min-width:32px;padding:3px 8px;border:1px solid #dce0d5;border-radius:8px;background:transparent;font-size:12px}.row-controls .remove{font-size:16px;margin-left:4px}
.account-bar{margin-top:12px}.account-bar button{padding:5px 8px}.account-actions{gap:5px}.sync-status{margin-top:3px;font-size:10px;min-height:15px}.tools{margin-top:8px;gap:7px;flex-wrap:wrap}.tools button{font-size:11px;padding:6px 9px}.empty{padding:42px 8px;font-size:13px}
@media(max-width:350px){main{padding-left:10px;padding-right:10px}.card,.managing .card{grid-template-columns:16px minmax(0,1fr) 126px;gap:5px}.quote{grid-template-columns:1fr 52px;column-gap:5px}.price{font-size:15px}.summary{font-size:11px}.summary>span:last-child{gap:4px!important}}

.grip{border:0;padding:0;min-width:24px;min-height:40px;font-size:22px;color:#8a967d;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.managing .card{grid-template-columns:26px minmax(0,1fr) 142px}.managing .row-controls{gap:5px;flex-wrap:wrap}.row-controls button{padding:3px 7px}.card.dragging{background:#e5ebde;outline:1px solid #c5d0b9;border-radius:8px}.sorting{user-select:none;-webkit-user-select:none;cursor:grabbing}.sorting .grip{cursor:grabbing}
@media(max-width:350px){.managing .card{grid-template-columns:24px minmax(0,1fr) 126px}}
</style>
</head>
<body><main>

<div class="summary"><span>我的关注 · <button id="refresh" style="padding:4px 8px;font-size:12px">刷新</button></span><span style="display:flex;align-items:center;gap:12px"><span id="count">0 项</span><button id="manageCancel" hidden style="padding:5px 8px;font-size:12px">取消</button><button id="manage" style="padding:5px 8px;font-size:12px" aria-pressed="false">管理</button><button id="add" style="padding:5px 10px;font-size:12px">＋ 添加</button></span></div>
<section id="list" aria-label="自选股票"></section>
<div class="foot" hidden><span id="quoteStatus" role="status">正在准备行情…</span><br>腾讯财经行情 · 前台每 15 秒刷新 · 港股使用较新报价接口，美股可能延迟；以每项行情时间为准。<br>自选保存在当前打开环境中；请保留原文件，并用相同浏览器打开。清理浏览器数据可能清除清单。</div>
<div class="account-bar"><span id="accountName">未登录</span><div class="account-actions"><button id="authOpen">登录 / 注册</button><button id="cloudReload" hidden>同步</button><button id="logout" hidden>退出</button></div></div><div class="sync-status" id="cloudStatus" role="status"></div><div class="tools"><button id="export">导出备份</button><button id="import">导入备份</button><button id="legacyImport" hidden>导入原自选</button></div>

<input type="file" id="file" accept="application/json,.json" hidden>
</main>
<dialog id="authDialog"><form id="authForm"><h2 id="authTitle">登录</h2><label for="username">用户名</label><input id="username" required minlength="3" maxlength="32" placeholder="3–32 位字母、数字、下划线或短横线" autocomplete="username" autocapitalize="none" spellcheck="false"><label for="password">密码</label><input id="password" type="password" required autocomplete="current-password"><p class="chart-note" id="registerNote" hidden>用户名不区分大小写。此账号不绑定真实邮箱，请记住用户名和密码。</p><div class="error" id="authError" role="alert"></div><button type="button" class="edit" id="authSwitch">没有账号？注册</button><div class="actions"><button type="button" id="authClose">取消</button><button class="primary" type="submit" id="authSubmit">登录</button></div></form></dialog>
<dialog id="dialog"><form id="form"><h2>添加关注</h2><label for="search">搜索股票</label><input id="search" placeholder="代码、首字母或名称，如 600 / gzmt / 茅台" autocomplete="off"><div class="search-note" id="searchNote" role="status">联网搜索，点击结果填入下方，也可手动填写。</div><div class="results" id="results"></div><label for="market">市场</label><select id="market"><option value="SH">沪市 A 股</option><option value="SZ">深市 A 股</option><option value="BJ">北交所</option><option value="HK">港股</option><option value="US">美股</option></select><label for="symbol">股票代码</label><input id="symbol" placeholder="例如 600519" maxlength="20" autocomplete="off" autocapitalize="characters" required><label for="name">名称或自定义别名</label><input id="name" placeholder="例如 贵州茅台 / 关注一" maxlength="40" autocomplete="off" required><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm"><h2>编辑别名</h2><label for="alias">名称或别名</label><input id="alias" required maxlength="40" autocomplete="off"><div class="actions"><button type="button" id="editCancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="chartDialog"><h2 id="chartTitle">当日分时</h2><div class="chart-meta" id="chartMeta" role="status"></div><div id="chartPlot"></div><div class="chart-meta" id="pointInfo"></div><p class="chart-note" hidden>上图：分时价格；下图：每分钟成交量。点击或拖动查看数据。首根量柱含开盘前累计成交，缺失分钟的成交量合并至下一个数据点。数据截至所示时间，可能存在延迟。</p><div class="actions"><button id="chartRefresh">刷新</button><button id="chartClose">关闭</button></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='quiet-watchlist-v1',markets={SH:'沪市',SZ:'深市',BJ:'北交所',HK:'港股',US:'美股'};let items=[],timer;

const SUPABASE_URL='https://vfuznbboqrxmrlirdwti.supabase.co';
const SUPABASE_KEY='sb_publishable_1OFiLFqzp9c3SSb0xdfriA_TF6bBAZF';
const sessionKey='quiet-auth-v1';
let managing=false,dragging=null,manageSnapshot=[],manageDirty=false,manageAttempted=false,manageNameWrites=new Set();
let session=null,cloudReady=false,cloudBusy=false,authBusy=false,authMode='login',accountVersion=0,refreshPromise=null,legacy=[];
try{const raw=localStorage.getItem(key);if(raw){const data=JSON.parse(raw);if(Array.isArray(data)&&data.every(valid))legacy=data}}catch(e){}
function authMessage(error){const code=error.code||'',message=String(error.message||'');if(code==='invalid_credentials')return '用户名或密码不正确';if(code==='user_already_exists'||/already registered/i.test(message))return '这个用户名已经注册，请登录或换一个';if(code==='email_not_confirmed')return '账号尚未确认，请联系管理员关闭邮箱确认并处理已有账号';if(/password/i.test(code+message)&&error.status===422)return '密码未满足项目最低要求，请检查 Supabase 的密码设置';if(code==='over_request_rate_limit'||error.status===429)return '操作太频繁，请稍后再试';if(code==='signup_disabled')return '项目尚未开放注册';if(code==='PGRST205'||code==='42P01')return '云端自选表尚未创建，请先运行建表 SQL';if(code==='42501')return '云端权限未配置完成，请检查表权限和 RLS 规则';if(error.status===401)return '登录已过期，请退出后重新登录';return message==='Failed to fetch'||error.name==='AbortError'||error instanceof TypeError?'网络连接失败，请检查能否访问 Supabase 后重试':message||'操作失败，请稍后再试'}
async function request(path,{method='GET',body,token,headers={}}={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);try{const response=await fetch(SUPABASE_URL+path,{method,headers:{apikey:SUPABASE_KEY,...(body!==undefined?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,referrerPolicy:'no-referrer'});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch(e){data=null}if(!response.ok){const err=new Error(data?.msg||data?.message||data?.error_description||data?.error||'请求失败');err.status=response.status;err.code=data?.code||data?.error_code;throw err}return data}finally{clearTimeout(timeout)}}
function persistSession(){try{if(session)localStorage.setItem(sessionKey,JSON.stringify(session));else localStorage.removeItem(sessionKey)}catch(e){$('cloudStatus').textContent='当前浏览器无法保持登录，关闭后需重新登录'}}
function adoptSession(data){if(!data?.access_token||!data?.refresh_token||!data?.user?.id)throw Error('登录响应不完整');session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:data.expires_at||Math.floor(Date.now()/1000)+(data.expires_in||3600),user:data.user};persistSession()}
async function ensureToken(){if(!session)throw Error('请先登录');if(session.expires_at>Date.now()/1000+60)return session.access_token;if(refreshPromise)return refreshPromise;const refresh=async()=>{try{const raw=JSON.parse(localStorage.getItem(sessionKey)||'null');if(raw?.user?.id===session?.user?.id&&raw.expires_at>session.expires_at)session=raw}catch(e){}if(!session)throw Error('请先登录');if(session.expires_at>Date.now()/1000+60)return session.access_token;const version=accountVersion,oldRefresh=session.refresh_token;const data=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:oldRefresh}});if(version!==accountVersion)throw Error('账号已切换，请重试');adoptSession(data);return session.access_token};refreshPromise=(navigator.locks?navigator.locks.request(sessionKey+'-refresh',refresh):refresh()).finally(()=>{refreshPromise=null});return refreshPromise}
async function dataRequest(query='',options={}){const version=accountVersion,token=await ensureToken();const data=await request('/rest/v1/quiet_watchlist'+query,{...options,token});if(version!==accountVersion)throw Error('账号已切换，请重新操作');return data}
function updateAccountUI(){const logged=!!session;$('accountName').textContent=logged?(session.user.user_metadata?.username||'已登录'):'未登录';$('authOpen').hidden=logged;$('logout').hidden=!logged;$('cloudReload').hidden=!logged;$('legacyImport').hidden=!logged||!legacy.length;$('add').disabled=!logged||!cloudReady||cloudBusy||managing;$('import').disabled=!logged||!cloudReady||cloudBusy||managing;$('legacyImport').disabled=!cloudReady||cloudBusy||managing;$('export').disabled=!logged||!cloudReady;$('logout').disabled=cloudBusy;document.querySelectorAll('.edit,.remove').forEach(el=>el.disabled=cloudBusy||!cloudReady);$('cloudReload').disabled=cloudBusy||managing;$('manageCancel').hidden=!managing;$('manageCancel').disabled=cloudBusy;$('manage').disabled=!logged||!cloudReady||cloudBusy;document.querySelectorAll('.move,.grip').forEach(el=>el.disabled=cloudBusy||!cloudReady||el.dataset.edge==='true')}
function showLogin(mode='login'){authMode=mode;$('authTitle').textContent=mode==='login'?'登录':'创建账号';$('authSubmit').textContent=mode==='login'?'登录':'注册';$('authSwitch').textContent=mode==='login'?'没有账号？注册':'已有账号？登录';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('authError').textContent='';$('registerNote').hidden=mode==='login';if(!$('authDialog').open)$('authDialog').showModal()}
$('authOpen').onclick=()=>showLogin();$('authClose').onclick=()=>$('authDialog').close();$('authSwitch').onclick=()=>{if(!authBusy)showLogin(authMode==='login'?'register':'login')};
$('authForm').onsubmit=async e=>{e.preventDefault();if(authBusy)return;const username=$('username').value.normalize('NFKC').trim().toLowerCase(),password=$('password').value;if(!/^[a-z0-9_\-]{3,32}$/.test(username)){$('authError').textContent='用户名请使用 3–32 位英文字母、数字、下划线或短横线';return}authBusy=true;$('authSubmit').disabled=true;$('authSwitch').disabled=true;$('authClose').disabled=true;$('authError').textContent=authMode==='login'?'正在登录…':'正在注册…';try{if(authMode==='register'){const settings=await request('/auth/v1/settings');if(!settings.mailer_autoconfirm)throw Error('项目尚未关闭 Confirm email，请先完成配置后注册')}const email=username+'@users.quiet-notes.invalid';const data=await request(authMode==='login'?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{method:'POST',body:{email,password,...(authMode==='register'?{data:{username}}:{})}});if(!data?.access_token)throw Error('注册未能建立登录会话，请检查邮箱确认设置');accountVersion++;adoptSession(data);items=[];cloudReady=false;render();$('password').value='';$('authDialog').close();await loadCloud();}catch(error){$('authError').textContent=authMessage(error)}finally{authBusy=false;$('authSubmit').disabled=false;$('authSwitch').disabled=false;$('authClose').disabled=false}};
$('authDialog').addEventListener('cancel',e=>{if(authBusy)e.preventDefault()});
$('logout').onclick=async()=>{if(cloudBusy)return;if(manageDirty&&!confirm('管理中的更改尚未保存，确定退出并放弃？'))return;resetManagement();cancelDrag();const old=session;accountVersion++;session=null;cloudReady=false;items=[];persistSession();for(const id of ['dialog','editDialog','chartDialog'])if($(id).open)$(id).close();render();$('cloudStatus').textContent='已退出登录';updateAccountUI();if(old)request('/auth/v1/logout?scope=local',{method:'POST',token:old.access_token}).catch(()=>{})};
async function loadCloud(){if(!session||cloudBusy||managing)return;const version=accountVersion;cloudBusy=true;cloudReady=false;$('cloudStatus').textContent='正在读取云端自选…';updateAccountUI();try{let rows=[],offset=0;while(true){const chunk=await dataRequest('?select=market,symbol,name,position&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=position.asc,created_at.asc,market.asc,symbol.asc&limit=500&offset='+offset);if(!Array.isArray(chunk))throw Error('云端数据格式异常');rows.push(...chunk);if(chunk.length<500)break;offset+=500}if(version!==accountVersion)return;items=rows.filter(valid);cloudReady=true;$('cloudStatus').textContent='已与云端同步';render();refreshQuotes()}catch(error){if(version===accountVersion){items=[];render();$('cloudStatus').textContent=authMessage(error)}}finally{cloudBusy=false;updateAccountUI()}}
$('cloudReload').onclick=loadCloud;
async function mutateCloud(task){if(!session||!cloudReady||cloudBusy){toast(!session?'请先登录':'请等待云端加载完成');return false}cloudBusy=true;updateAccountUI();$('cloudStatus').textContent='正在保存…';try{await task();$('cloudStatus').textContent='已保存到云端';render();refreshQuotes();return true}catch(error){$('cloudStatus').textContent=authMessage(error);toast('未保存：'+authMessage(error));return false}finally{cloudBusy=false;updateAccountUI()}}
function rowFilter(item){return '?user_id=eq.'+encodeURIComponent(session.user.id)+'&market=eq.'+encodeURIComponent(item.market)+'&symbol=eq.'+encodeURIComponent(item.symbol)}
async function insertStocks(stocks){const existing=new Set(items.map(x=>x.market+':'+x.symbol)),added=[];for(const x of stocks)if(valid(x)&&!existing.has(x.market+':'+x.symbol)){existing.add(x.market+':'+x.symbol);added.push({market:x.market,symbol:x.symbol,name:x.name})}if(!added.length){toast('这些股票已在清单中');return false}let nextPosition=Math.max(0,...items.map(x=>x.position||0))+1024;return mutateCloud(async()=>{const rows=added.map(x=>({...x,user_id:session.user.id,position:(nextPosition+=1024)-1024}));const saved=await dataRequest('?on_conflict=user_id,market,symbol',{method:'POST',body:rows,headers:{Prefer:'resolution=ignore-duplicates,return=representation'}});if(!Array.isArray(saved))throw Error('云端保存响应异常');items.push(...saved.filter(valid));toast('已保存 '+saved.length+' 项到云端')})}


function resetManagement(){managing=false;manageDirty=false;manageAttempted=false;manageNameWrites.clear();manageSnapshot=[]}
function draftChanged(){manageDirty=JSON.stringify(items.map(x=>[x.market,x.symbol,x.name]))!==JSON.stringify(manageSnapshot.map(x=>[x.market,x.symbol,x.name]));$('cloudStatus').textContent=manageDirty?'有未保存的更改 · 点击完成保存':'管理模式 · 调整后点击完成';render()}
$('manage').onclick=async()=>{if(cloudBusy||dragging||!cloudReady)return;if(!managing){manageSnapshot=items.map(x=>({...x}));managing=true;manageDirty=false;manageAttempted=false;draftChanged()}else await commitManagement()};
$('manageCancel').onclick=async()=>{if(cloudBusy)return;cancelDrag();const reload=manageAttempted;if(!reload)items=manageSnapshot.map(x=>({...x}));resetManagement();render();if(reload)await loadCloud();else $('cloudStatus').textContent='已取消管理更改'};
async function commitManagement(){
 if(!managing||cloudBusy||!session)return false;
 if(!manageDirty&&!manageAttempted){resetManagement();render();$('cloudStatus').textContent='已与云端同步';return true}
 const version=accountVersion,owner=session.user.id,snapshot=manageSnapshot.map(x=>({...x})),draft=items.map((x,i)=>({...x,position:(i+1)*1024}));cloudBusy=true;updateAccountUI();$('manage').textContent='保存中…';$('cloudStatus').textContent='正在保存管理更改…';
